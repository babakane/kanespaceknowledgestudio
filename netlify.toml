# Netlify Configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite settings
  VITE_API_KEY = ""
  VITE_MODEL_PROVIDER = "google"
  VITE_HF_API_KEY = ""
  VITE_MODEL_NAME = "mistralai/Mistral-7B-Instruct-v0.1"
  VITE_CLOUD_STORAGE_PROVIDER = "google-drive"
  VITE_ENABLE_RESPONSE_CACHING = "true"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Preload critical resources
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
